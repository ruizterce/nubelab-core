name: nubelab-core

services:
  web:
    image: ${IMAGE_PREFIX}/nubelab-core:latest
    container_name: nubelab-core
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
      NEXT_PUBLIC_DEFAULT_LOCALE: en
      API_BASE_URL: http://nubelab-api:4000
    networks:
      - proxy_net
      - shared_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  proxy_net:
    external: true
  shared_net:
    external: true
