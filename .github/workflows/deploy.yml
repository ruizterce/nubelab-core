name: Deploy to VPS

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-nubelab-core-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tags: tag:github-actions

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            API_BASE_URL=http://nubelab-api:4000
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DIR=/srv/platform/public/nubelab-core
            rm -rf "$DIR"
            mkdir -p "$DIR"
            printf '%s\n' \
              "name: nubelab-core" \
              "services:" \
              "  web:" \
              "    container_name: nubelab-core" \
              "    image: ghcr.io/${{ github.repository }}:latest" \
              "    environment:" \
              "      NODE_ENV: production" \
              "      NEXT_PUBLIC_SITE_URL: https://nubelab.es" \
              "      NEXT_PUBLIC_DEFAULT_LOCALE: en" \
              "      API_BASE_URL: http://nubelab-api:4000" \
              "    networks:" \
              "      - proxy_net" \
              "      - shared_net" \
              "    healthcheck:" \
              '      test: ["CMD-SHELL", "node -e \"fetch('\''http://127.0.0.1:3000/health'\'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]' \
              "      interval: 30s" \
              "      timeout: 5s" \
              "      retries: 3" \
              "    restart: unless-stopped" \
              "networks:" \
              "  proxy_net:" \
              "    external: true" \
              "  shared_net:" \
              "    external: true" \
              > "$DIR/docker-compose.yml"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            cd "$DIR"
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
            sleep 3
            curl -s http://localhost:3000/health | head -c 200
